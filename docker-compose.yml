x-app-env: &app-env
  DJANGO_SETTINGS_MODULE: evitrack.settings.production
  EVITRACK_SECRET_KEY: ${EVITRACK_SECRET_KEY:?set EVITRACK_SECRET_KEY in .env}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
  SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
  DATABASE_URL: postgres://evitrack:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/evitrack
  REDIS_URL: redis://redis:6379/1
  EVITRACK_CACHE_URL: redis://redis:6379/1
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  EVIDENCE_ROOT: /srv/evidence
  EVIDENCE_USE_X_ACCEL: "True"

x-app: &app
  build: .
  image: evitrack-app:local
  env_file:
    - path: .env
      required: false
  environment: *app-env
  volumes:
    - evidence_store:/srv/evidence
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: evitrack
      POSTGRES_USER: evitrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evitrack -d evitrack"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["python", "manage.py", "migrate", "--noinput"]
    restart: "no"

  web:
    <<: *app
    command: ["gunicorn", "evitrack.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "3", "--access-logfile", "-"]
    volumes:
      - evidence_store:/srv/evidence
      - staticfiles:/app/staticfiles
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    <<: *app
    command: ["celery", "-A", "evitrack", "worker", "-l", "info"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  beat:
    <<: *app
    command: ["celery", "-A", "evitrack", "beat", "-l", "info", "--schedule", "/tmp/celerybeat-schedule"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/usr/share/nginx/static:ro
      - evidence_store:/srv/evidence:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  pgdata:
  staticfiles:
  evidence_store:
