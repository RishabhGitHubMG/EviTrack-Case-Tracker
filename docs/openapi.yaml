openapi: 3.0.3
info:
  title: EviTrack API
  version: 1.0.0
paths:
  /api/v1/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      responses:
        '200':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      responses:
        '200':
          description: No response body
  /api/v1/auth/otp/resend/:
    post:
      operationId: auth_otp_resend_create
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/otp/verify/:
    post:
      operationId: auth_otp_verify_create
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/session/ping/:
    post:
      operationId: auth_session_ping_create
      tags:
      - auth
      responses:
        '200':
          description: No response body
  /api/v1/auth/totp/verify/:
    post:
      operationId: auth_totp_verify_create
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/health/:
    get:
      operationId: health_retrieve
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: ''
components:
  schemas:
    Status:
      type: object
      properties:
        status:
          type: string
      required:
      - status
