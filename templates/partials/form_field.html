{% with f=field %}
<div class="mb-3">
    <label for="{{ f.id_for_label }}" class="form-label font-sm fw-medium">
        {{ f.label }}{% if f.field.required %} <span class="text-danger">*</span>{% endif %}
    </label>
    {{ f }}
    {% if f.help_text %}<div class="form-text small">{{ f.help_text }}</div>{% endif %}
    {% for err in f.errors %}<div class="text-danger small mt-1">{{ err }}</div>{% endfor %}
</div>
{% endwith %}
